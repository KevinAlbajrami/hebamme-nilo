server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Deterministic healthcheck endpoint for orchestration / reverse proxies.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://backend.example.com;" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # If you're proxying API on the same host, uncomment and adjust:
        # proxy_pass http://127.0.0.1:1337/;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;
    }
}
